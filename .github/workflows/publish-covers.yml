name: Publicar capas

on:
  push:
    paths:
      - 'assets/**/*.zip'
      - 'assets/**/*.b64'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publicar lotes
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import tempfile
          import zipfile
          from pathlib import Path

          assets = Path('assets')
          covers = Path('covers')
          covers.mkdir(parents=True, exist_ok=True)

          # ZIPs enviados diretamente ao repositório.
          for source in assets.rglob('*.zip'):
              with zipfile.ZipFile(source) as archive:
                  archive.extractall(covers)
                  for name in archive.namelist():
                      print(f'publicado: covers/{name}')

          # Compatibilidade com pacotes Base64 já existentes.
          for source in assets.rglob('*.b64'):
              encoded = ''.join(source.read_text(encoding='utf-8').split())
              payload = base64.b64decode(encoded)

              if source.name.endswith('.zip.b64'):
                  with tempfile.NamedTemporaryFile(suffix='.zip') as temporary:
                      temporary.write(payload)
                      temporary.flush()
                      with zipfile.ZipFile(temporary.name) as archive:
                          archive.extractall(covers)
                          for name in archive.namelist():
                              print(f'publicado: covers/{name}')
              else:
                  relative = source.relative_to(assets)
                  output = covers / relative.with_suffix('')
                  output.parent.mkdir(parents=True, exist_ok=True)
                  output.write_bytes(payload)
                  print(f'publicado: {output}')
          PY

      - name: Commit das imagens
        shell: bash
        run: |
          git config user.name 'nuvio-covers-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add covers/
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para publicar.'
          else
            git commit -m 'Publica capas geradas'
            git push
          fi
