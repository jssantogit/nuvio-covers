name: Publicar capas

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/**/*.zip'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publicar lotes ZIP
        shell: bash
        run: |
          python - <<'PY'
          import zipfile
          from pathlib import Path

          assets = Path('assets')
          covers = Path('covers')
          covers.mkdir(parents=True, exist_ok=True)
          found = False

          for source in assets.rglob('*.zip'):
              found = True
              print(f'processando: {source}')
              with zipfile.ZipFile(source) as archive:
                  for member in archive.infolist():
                      destination = (covers / member.filename).resolve()
                      if covers.resolve() not in destination.parents and destination != covers.resolve():
                          raise RuntimeError(f'Caminho inseguro no ZIP: {member.filename}')
                  archive.extractall(covers)
                  for name in archive.namelist():
                      print(f'publicado: covers/{name}')

          if not found:
              raise RuntimeError('Nenhum arquivo ZIP encontrado em assets/.')
          PY

      - name: Commit das imagens
        shell: bash
        run: |
          git config user.name 'nuvio-covers-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add covers/
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para publicar.'
          else
            git commit -m 'Publica capas geradas'
            git push
          fi
