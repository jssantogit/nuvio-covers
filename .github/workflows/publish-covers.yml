name: Publicar capas

on:
  workflow_dispatch:
  push:
    paths:
      - 'assets/**/*.zip'
      - 'assets/**/*.zip.b64'
      - '.github/workflows/publish-covers.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Publicar lotes
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import io
          import zipfile
          from pathlib import Path

          assets = Path('assets')
          covers = Path('covers')
          covers.mkdir(parents=True, exist_ok=True)
          found = False

          def extract_archive(archive, source_name):
              global found
              found = True
              print(f'processando: {source_name}')
              for member in archive.infolist():
                  destination = (covers / member.filename).resolve()
                  if covers.resolve() not in destination.parents and destination != covers.resolve():
                      raise RuntimeError(f'Caminho inseguro no ZIP: {member.filename}')
              archive.extractall(covers)
              for name in archive.namelist():
                  print(f'publicado: covers/{name}')

          for source in assets.rglob('*.zip'):
              with zipfile.ZipFile(source) as archive:
                  extract_archive(archive, source)

          for source in assets.rglob('*.zip.b64'):
              encoded = ''.join(source.read_text(encoding='utf-8').split())
              payload = base64.b64decode(encoded, validate=True)
              with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                  extract_archive(archive, source)

          if not found:
              raise RuntimeError('Nenhum pacote ZIP encontrado em assets/.')
          PY

      - name: Commit das imagens
        shell: bash
        run: |
          git config user.name 'nuvio-covers-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add covers/
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para publicar.'
          else
            git commit -m 'Publica capas geradas'
            git push
          fi
